schema = "bloom.petal.package.v1"
name = "pumpfun"

[source]
kind = "github"
repository = "bloom-directory/bloom-petal-pumpfun"

[build]
command = "scripts/build.sh"
outputs = ["petal/pumpfun"]

[consent]
summary = "List the latest and live Pump.fun coins, check a coin's holders, creator and launch for risks, chart its price and list its trades, see what the selected Bloom account holds, and buy or sell an existing coin from the Bloom account you selected. Every trade is one operation you approve in Bloom, capped at the SOL ceiling the approval shows, and rebuilt with a fresh blockhash after you approve; no session key, no separate wallet and no standing budget. Launch a new coin with that account as its creator and a first buy, approved the same way; an uploaded image and metadata are pinned to IPFS through Pump before approval. Place limit orders: each is approved once, signed on a durable nonce the account owns (an order slot), kept by the Petal, and checked without exposing executable signatures and sent when its fixed price limit permits; cancellation races on the same nonce and is pending until finalized. Slots remain reserved while unsettled. An empty token account can be closed, returning its rent to the same account. Fee collection and fee sharing are not supported."

[caps]
allowed = ["bloom:http", "bloom:store", "bloom:sign", "bloom:vfs.read"]

[[net.allow]]
binding = "pump"
host = "fun-block.pump.fun"
methods = ["post"]
paths = ["/agents/swap", "/agents/create-coin"]

[[net.allow]]
binding = "pump-metadata"
host = "pump.fun"
methods = ["post"]
paths = ["/api/ipfs"]

[[net.allow]]
binding = "coins"
host = "frontend-api-v3.pump.fun"
methods = ["get"]
paths = ["/coins-v2/*", "/coins", "/coins/currently-live", "/coins/top-holders/*"]

[[net.allow]]
binding = "pump-trades"
host = "swap-api.pump.fun"
methods = ["get"]
paths = ["/v2/coins/*/candles", "/v2/coins/*/trades"]

[[net.allow]]
binding = "solana"
host = "rpc.solanatracker.io"
methods = ["post"]
paths = ["/public"]

[[net.allow]]
binding = "solana-verify"
host = "api.mainnet-beta.solana.com"
methods = ["post"]
paths = ["/"]

[[net.allow]]
binding = "jito"
host = "mainnet.block-engine.jito.wtf"
methods = ["post"]
paths = ["/api/v1/transactions"]

[sign]
allowed_intents = ["pumpfun.buy", "pumpfun.sell", "pumpfun.close_token_account", "pumpfun.launch", "pumpfun.limit_order", "pumpfun.order_slot", "pumpfun.cancel_order"]
fee_asset = { chain = "solana", asset = "native" }

[store]
namespaces = ["state"]
secret_namespaces = ["secrets"]
