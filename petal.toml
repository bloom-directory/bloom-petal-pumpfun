schema = "bloom.petal.package.v1"
name = "pumpfun"

[source]
kind = "github"
repository = "bloom-directory/bloom-petal-pumpfun"

[build]
command = "scripts/build.sh"
outputs = ["petal/pumpfun"]

[account]
aware = true

[consent]
summary = "List the latest and live Pump.fun coins, check a coin's holders, creator and launch for risks, chart its price and list its trades, see what the selected Bloom account holds, and buy or sell an existing coin from the Bloom account you selected. Every trade is one operation you approve in Bloom, capped at the SOL ceiling the approval shows, and rebuilt with a fresh blockhash after you approve; no session key, no separate wallet and no standing budget. An empty token account can be closed, returning its rent to the same account. Coin creation, fee collection and fee sharing are not supported."

[caps]
allowed = ["bloom:http", "bloom:store", "bloom:sign", "bloom:vfs.read"]

[[net.allow]]
binding = "pump"
host = "fun-block.pump.fun"
methods = ["post"]
paths = ["/agents/swap"]

[[net.allow]]
binding = "coins"
host = "frontend-api-v3.pump.fun"
methods = ["get"]
paths = ["/coins-v2/*", "/coins", "/coins/currently-live", "/coins/top-holders/*"]

[[net.allow]]
binding = "pump-trades"
host = "swap-api.pump.fun"
methods = ["get"]
paths = ["/v2/coins/*/candles", "/v2/coins/*/trades"]

[[net.allow]]
binding = "solana"
host = "rpc.solanatracker.io"
methods = ["post"]
paths = ["/public"]

[[net.allow]]
binding = "solana-verify"
host = "api.mainnet-beta.solana.com"
methods = ["post"]
paths = ["/"]

[[net.allow]]
binding = "jito"
host = "mainnet.block-engine.jito.wtf"
methods = ["post"]
paths = ["/api/v1/transactions"]

[sign]
allowed_intents = ["pumpfun.buy", "pumpfun.sell", "pumpfun.close_token_account"]
fee_asset = { chain = "solana", asset = "native" }

[store]
namespaces = ["state"]
secret_namespaces = ["secrets"]
