schema = "bloom.petal.build.v1"
name = "pumpfun"
routes = "route/files"
output = "petal/pumpfun"

[route_crate]
package = "pumpfun-route"
path = "route"
alias = "pumpfun_route"

[sdk]
package = "bloom-petal-sdk"
git = "https://github.com/bloom-directory/petal"
rev = "8691f84acf98db203a75850b152d55366403f6a5"

[dependencies]
base64 = "0.22"
bs58 = "0.5"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
